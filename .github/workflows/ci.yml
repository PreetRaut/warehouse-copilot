name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev extras)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest --cov=warehouse_copilot --cov-report=term-missing

      - name: dbt parse (compile-time validation, no warehouse needed)
        working-directory: dbt/warehouse_copilot
        env:
          # Dummy values: `dbt deps` + `dbt parse` build the manifest without
          # connecting to Snowflake, so no secrets are required in CI.
          SNOWFLAKE_ACCOUNT: dummy
          SNOWFLAKE_USER: dummy
          SNOWFLAKE_PASSWORD: dummy
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/warehouse_copilot
        run: |
          cp profiles.example.yml profiles.yml
          dbt deps
          dbt parse
