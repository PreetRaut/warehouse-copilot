# Optional: run the Dagster UI in a container.
#   docker compose up dagster   ->  http://localhost:3000
services:
  dagster:
    build: .
    command: dagster dev -h 0.0.0.0 -p 3000 -f orchestration/warehouse_copilot_dagster/definitions.py
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - ./dagster_home:/app/dagster_home
