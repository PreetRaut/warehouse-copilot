[project]
name = "warehouse-copilot"
version = "0.1.0"
description = "An AI data engineering platform: public API -> Snowflake -> dbt -> Dagster, with an MCP server that lets any LLM query the warehouse in natural language."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Preet Raut" }]
keywords = ["data-engineering", "snowflake", "dbt", "dagster", "mcp", "llm", "elt"]

dependencies = [
    "snowflake-connector-python[pandas]>=3.12",
    "pandas>=2.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.24,<2,<2",
    "dbt-snowflake>=1.8",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "sqlfluff>=3.1",
    "sqlfluff-templater-dbt>=3.1",
]

[project.scripts]
wc-ingest = "warehouse_copilot.ingest.run:main"
wc-mcp = "warehouse_copilot.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/PreetRaut/warehouse-copilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
